services:
  automatic1111-stable-diffusion-webui:
    build:
      context: .
      dockerfile: docker_repos/automatic1111-stable-diffusion-webui/Dockerfile
    container_name: ml-analysis-automatic1111-stable-diffusion-webui
    environment:
    - JUPYTER_ENABLE_LAB=yes
    - REPO_NAME=AUTOMATIC1111_stable-diffusion-webui
    ports:
    - 8888:8888
    volumes:
    - ./analysis/automatic1111-stable-diffusion-webui:/workspace/analysis
  huggingface-transformers:
    build:
      context: .
      dockerfile: docker_repos/huggingface-transformers/Dockerfile
    container_name: ml-analysis-huggingface-transformers
    environment:
    - JUPYTER_ENABLE_LAB=yes
    - REPO_NAME=huggingface_transformers
    ports:
    - 8889:8889
    volumes:
    - ./analysis/huggingface-transformers:/workspace/analysis
  keras-team-keras:
    build:
      context: .
      dockerfile: docker_repos/keras-team-keras/Dockerfile

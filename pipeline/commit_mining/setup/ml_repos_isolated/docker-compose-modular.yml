    - JUPYTER_ENABLE_LAB=yes
    - REPO_NAME=keras-team_keras
    ports:
    - 8890:8890
    volumes:
    - ./analysis/keras-team-keras:/workspace/analysis
  pytorch-pytorch:
    build:
      context: .
      dockerfile: docker_repos/pytorch-pytorch/Dockerfile
    container_name: ml-analysis-pytorch-pytorch
    environment:
    - JUPYTER_ENABLE_LAB=yes
    - REPO_NAME=pytorch_pytorch
    ports:
    - 8891:8891
    volumes:
    - ./analysis/pytorch-pytorch:/workspace/analysis
  rasbt-mlxtend:
    build:
      context: .
      dockerfile: docker_repos/rasbt-mlxtend/Dockerfile
    container_name: ml-analysis-rasbt-mlxtend
    environment:
    - JUPYTER_ENABLE_LAB=yes
    - REPO_NAME=rasbt_mlxtend
    ports:
    - 8892:8892
    volumes:
    - ./analysis/rasbt-mlxtend:/workspace/analysis
  tqdm-tqdm:
    build:
      context: .
      dockerfile: docker_repos/tqdm-tqdm/Dockerfile
    container_name: ml-analysis-tqdm-tqdm
    environment:
    - JUPYTER_ENABLE_LAB=yes
    - REPO_NAME=tqdm_tqdm
